name: noir_rs

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  fmt:
    name: Fmt check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --check

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # The test circuits must be compiled with the Noir release the noir crates come from.
      - name: Read the Noir version from Cargo.toml
        id: noir-version
        run: |
          VERSION=$(sed -n 's/^nargo = .*rev = "v\([^"]*\)".*/\1/p' Cargo.toml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install nargo
        uses: noir-lang/noirup@v0.1.4
        with:
          toolchain: ${{ steps.noir-version.outputs.version }}

      - name: Compile the test circuits
        run: nargo compile --workspace
        working-directory: circuits

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test --features barretenberg
